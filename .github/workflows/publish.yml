name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install aux4
        run: curl -s https://aux4.io/install | bash

      - name: Run tests
        run: |
          cd package
          aux4 test run

      - name: Publish package
        uses: aux4/publish-package-action@v1
        with:
          directory: package
          token: ${{ secrets.AUX4_ACCESS_TOKEN }}
